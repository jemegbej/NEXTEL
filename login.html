<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXTEL Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

:root{
--green:#2e7d32;
--green-dark:#1b5e20;
--lemon:#dfff4f;
--white:#ffffff;
}

body{
background:linear-gradient(180deg,var(--green-dark),var(--green));
color:var(--white);
padding:20px;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

.container{
width:100%;
max-width:420px;
background:rgba(255,255,255,.08);
padding:28px;
border-radius:18px;
border:1px solid rgba(255,255,255,.15);
box-shadow:0 0 25px rgba(0,0,0,.25);
backdrop-filter:blur(8px);
text-align:center;
}

.logo{
font-size:30px;
font-weight:800;
color:var(--lemon);
margin-bottom:8px;
}

h2{
font-size:20px;
margin-bottom:8px;
color:#fff;
}

.subtitle{
font-size:13px;
color:#f2f2f2;
line-height:1.6;
margin-bottom:18px;
}

input{
width:100%;
padding:14px;
margin-bottom:10px;
border:1px solid rgba(255,255,255,.15);
border-radius:12px;
background:rgba(255,255,255,.12);
color:#fff;
outline:none;
transition:.3s;
}

input::placeholder{
color:#e8e8e8;
}

input:focus{
border:1px solid var(--lemon);
box-shadow:0 0 8px rgba(223,255,79,.35);
}

button{
width:100%;
padding:15px;
border:none;
border-radius:30px;
background:var(--lemon);
color:var(--green-dark);
font-weight:700;
cursor:pointer;
margin-top:10px;
transition:.3s;
}

button:hover{
transform:translateY(-2px);
}

.footer-note{
margin-top:18px;
padding-top:14px;
border-top:1px solid rgba(255,255,255,.12);
font-size:12px;
color:#f0f0f0;
line-height:1.6;
}

.footer-note span{
color:var(--lemon);
font-weight:700;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">NEXTEL</div>

<h2>Welcome Back</h2>

<div class="subtitle">
Login to continue your earning journey on the NEXTEL digital ecosystem.
</div>
<input type="text" id="username" placeholder="Username">

<input type="password" id="password" placeholder="Password">

<button onclick="loginUser()">LOGIN</button>

<div class="footer-note">
<span>Your selected plan will appear after login.</span><br>
Don't have an account? Register first to activate your Nextel plan.
</div>

</div>

<script>

function loginUser(){

const username = document.getElementById("username").value.trim();
const password = document.getElementById("password").value.trim();

const savedUser = localStorage.getItem("nextel_username");
const savedPass = localStorage.getItem("nextel_password");

if(username === "" || password === ""){
alert("Please fill in all fields.");
return;
}

if(username !== savedUser || password !== savedPass){
alert("Invalid username or password.");
return;
}

window.location.href = "dashboard.html";

}

</script>

</body>
</html>
