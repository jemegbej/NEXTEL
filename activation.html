<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXTEL Activation</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
:root{--green:#1f6b2a;--green2:#2d7d34;--lemon:#dfff3f;--white:#fff}
body{background:linear-gradient(180deg,var(--green),var(--green2));color:#fff;padding:18px}
.container{max-width:480px;margin:auto}.card{background:rgba(255,255,255,.1);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.12);border-radius:26px;padding:22px;margin-bottom:18px}
.title,.section h3{color:var(--lemon);font-weight:800}.amount{font-size:40px;color:var(--lemon);font-weight:800;margin:15px 0}.feature{margin:8px 0;opacity:.95}
.btn{display:block;width:100%;padding:15px;border:none;border-radius:40px;font-weight:800;margin-top:12px;cursor:pointer}.primary{background:var(--lemon);color:var(--green)}.dark{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.12)}
.bank{background:rgba(255,255,255,.08);padding:15px;border-radius:16px}.timer{font-size:42px;color:var(--lemon);font-weight:800}.hide{display:none}
</style></head><body><div class="container">
<div id=f1 class=card><div class=title>NEXTEL ACCOUNT ACTIVATION</div><p>Activate your account to unlock all earning modules.</p><div class=amount id=fee></div><div class=section><h3>EARNING MODULES</h3><div id=mods></div></div><button class="btn primary" onclick="s(2)">Activate Now</button><button class="btn dark" onclick="location.href='dashboard.html'">Maybe Later</button></div>
<div id=f2 class="card hide"><div class=title>Secure Payment</div><div class=amount id=amt></div><div class=timer id=t>5:00</div><div class="bank">
<h3 style="color:var(--lemon);margin-bottom:12px;">🏦 Bank Details</h3>
<p><strong>Bank Name:</strong> KUDA</p>
<p><strong>Account Number:</strong> 2078683879</p>
<p><strong>Account Name:</strong> JOSHUA JEMEGBE</p><br>
<button class="btn dark" onclick="copyMono()">📋 Copy Account Number</button>
</div><button class="btn primary" onclick="s(3)">I've Made Payment</button></div>
<div id=f3 class="card hide"><div class=title>Verification Complete</div><a id=w class="btn primary" target=_blank>Send Proof via WhatsApp</a></div>
</div>
<script>
const plan=localStorage.getItem("nextel_plan")||"DIAMOND";
const d={DIAMOND:{fee:"₦10,500",mods:[["💰 Instant Cashback","₦9,000"],["🤝 Direct Referral","₦7,200"],["📞 Call Rewards","₦5,500"],["📩 SMS Rewards","₦3,000"],["▶️ YouTube Earnings","₦20,000"],["🎁 Spillover Bonus","₦1,000"]]},ROYAL:{fee:"₦17,500",mods:[["💰 Instant Cashback","₦16,000"],["🤝 Direct Referral","₦12,500"],["📞 Call Rewards","₦15,000"],["📩 SMS Rewards","₦10,000"],["▶️ YouTube Premium","₦40,000"],["👻 Snapchat Earnings","₦6,000"],["🎉 Network Bonus","₦8,000"],["📊 Nextel Web Gain","₦50,000"]]}};
fee.innerText=d[plan].fee;amt.innerText=d[plan].fee;d[plan].mods.forEach(m=>mods.innerHTML+=`<p class=feature>${m[0]} - <b>${m[1]}</b></p>`);
function s(n){f1.classList.add('hide');f2.classList.add('hide');f3.classList.add('hide');document.getElementById('f'+n).classList.remove('hide');if(n==2){let x=300;let i=setInterval(()=>{t.innerText=Math.floor(x/60)+":"+(x%60).toString().padStart(2,'0');if(--x<0)clearInterval(i)},1000)}if(n==3){w.href="https://wa.me/2348101137540?text="+encodeURIComponent(`Hello NEXTEL Admin, I have completed my activation payment. Plan: ${plan} Amount: ${d[plan].fee}`)}}
function copyMono(){navigator.clipboard.writeText('2078683879');alert('Account number copied successfully!');}</script></body></html>
